name: Build Windows EXE

on:
  push:
    branches: [ exe_file ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java sources
        shell: cmd
        run: |
          mkdir build\classes
          javac -d build\classes ^
            mvc_chat_github\mvc_chat\src\chat\*.java ^
            mvc_chat_github\mvc_chat\src\chat\model\*.java ^
            mvc_chat_github\mvc_chat\src\chat\view\*.java ^
            mvc_chat_github\mvc_chat\src\chat\controller\*.java ^
            mvc_chat_github\mvc_chat\src\chat\network\*.java

      - name: Create fat JAR
        shell: cmd
        run: |
          mkdir build\jar
          echo Main-Class: chat.ChatApplication > build\manifest.txt
          jar cfm build\jar\ChatApp.jar build\manifest.txt -C build\classes .

      - name: Build EXE with jpackage
        shell: cmd
        run: |
          jpackage ^
            --type exe ^
            --name "MVCChat" ^
            --app-version "1.0.0" ^
            --input build\jar ^
            --main-jar ChatApp.jar ^
            --main-class chat.ChatApplication ^
            --dest build\output ^
            --win-console ^
            --win-shortcut ^
            --win-menu

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MVCChat-Windows-EXE
          path: build\output\*.exe
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MVCChat v1.0.${{ github.run_number }}"
          files: build\output\*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
